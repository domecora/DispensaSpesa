<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dispensa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#faf7f2">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>Dispensa & Pasti</title>
<style>
:root{--bg:#faf7f2;--card:#ffffff;--ink:#241f1a;--mute:#7a6f63;--line:#e8e1d6;--acc:#2f6b4f;--acc-ink:#ffffff;--warn:#b4530a;--warnbg:#fff1e3;--ok:#2f6b4f;--okbg:#e5f2ea;--bad:#b42318;--badbg:#fdecea;--chip:#f1ece3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#171512;--card:#221f1b;--ink:#f1ece4;--mute:#a79c8e;--line:#35302a;--acc:#5fb98c;--acc-ink:#0f1f17;--warn:#f0a35e;--warnbg:#3a2a1a;--ok:#5fb98c;--okbg:#1c2e25;--bad:#f28b82;--badbg:#3a1f1d;--chip:#2c2823}}
:root[data-theme="dark"]{--bg:#171512;--card:#221f1b;--ink:#f1ece4;--mute:#a79c8e;--line:#35302a;--acc:#5fb98c;--acc-ink:#0f1f17;--warn:#f0a35e;--warnbg:#3a2a1a;--ok:#5fb98c;--okbg:#1c2e25;--bad:#f28b82;--badbg:#3a1f1d;--chip:#2c2823}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;max-width:640px;margin:0 auto;padding-bottom:84px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
header h1{font-size:22px;margin:0;font-family:Georgia,"Times New Roman",serif;letter-spacing:-.2px}
.sync{font-size:12px;color:var(--mute);background:var(--chip);padding:3px 9px;border-radius:99px}
main{padding:6px 14px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.mute{color:var(--mute);font-size:13px}
.title{font-weight:600}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.sum b{display:block;font-size:18px}
.sum span{font-size:12px;color:var(--mute)}
input,select,button,textarea{font:inherit;color:inherit}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);min-height:44px}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--acc);color:var(--acc-ink);font-weight:600;min-height:44px;cursor:pointer}
.btn.sec{background:var(--chip);color:var(--ink)}
.btn.del{background:var(--badbg);color:var(--bad)}
.btn.sm{padding:7px 12px;min-height:34px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--mute);white-space:nowrap}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.bad{background:var(--badbg);color:var(--bad)}
.badge.ok{background:var(--okbg);color:var(--ok)}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;margin:0 0 12px}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:10px;font-weight:600;color:var(--mute);min-height:38px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20;max-width:640px;margin:0 auto}
.tabs button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--mute);font-size:11px;font-weight:600;min-height:48px}
.tabs button span{font-size:21px;line-height:1}
.tabs button.on{color:var(--acc)}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--acc);color:var(--acc-ink);font-size:30px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:15}
.sw{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end}
.bd{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sh{position:relative;background:var(--bg);border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;max-width:640px;width:100%;margin:0 auto}
.sh h2{margin:0 0 4px;font-size:19px;font-family:Georgia,serif}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px;align-items:center;margin-bottom:6px}
.empty{text-align:center;color:var(--mute);padding:34px 18px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11px;text-align:center;color:var(--mute);padding:4px 0}
.day{aspect-ratio:1/1.05;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:4px 5px;display:flex;flex-direction:column;justify-content:space-between;font-size:14px;cursor:pointer;min-width:0}
.day.out{opacity:.35}
.day.sel{box-shadow:inset 0 0 0 2px var(--acc)}
.day.today{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.day .n{font-weight:600}
.day .cnt{align-self:flex-end;font-size:11px;background:var(--acc);color:var(--acc-ink);border-radius:99px;padding:0 7px;font-weight:700}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.mnav b{text-transform:capitalize;font-size:17px}
.mnav button{border:0;background:var(--chip);border-radius:10px;width:44px;height:40px;font-size:18px;color:var(--ink)}
.need{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.need:last-child{border-bottom:0}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);margin:16px 2px 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:99;max-width:90%}
.x{border:0;background:var(--badbg);color:var(--bad);border-radius:10px;min-height:44px;font-size:18px}
#login{display:none;position:fixed;inset:0;z-index:300;background:var(--bg);align-items:center;justify-content:center;padding:24px}
#login .box{width:100%;max-width:360px}
#login h2{font-family:Georgia,serif;margin:0 0 6px}
#login input{margin-top:10px}
#login .err{color:var(--bad);font-weight:600;font-size:14px;min-height:20px;margin-top:10px}
</style>
</head>
<body>
<header><h1>Dispensa &amp; Pasti</h1><span class="sync" id="sync" onclick="openSync()" style="cursor:pointer">solo su questo dispositivo</span></header>
<main id="view"></main>
<div id="fabslot"></div>
<nav class="tabs" id="tabs">
  <button data-t="inv" onclick="go('inv')"><span>🥫</span>Dispensa</button>
  <button data-t="rec" onclick="go('rec')"><span>📖</span>Ricette</button>
  <button data-t="plan" onclick="go('plan')"><span>🗓️</span>Piano</button>
  <button data-t="cook" onclick="go('cook')"><span>🍳</span>Cucina</button>
  <button data-t="shop" onclick="go('shop')"><span>🛒</span>Spesa</button>
</nav>

<script>
/* ---------- utilità ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid8=()=>Math.random().toString(36).slice(2,10);
const norm=s=>String(s).trim().toLowerCase().replace(/\s+/g,' ');
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addDays(x,-((x.getDay()+6)%7))};
const fmtEur=n=>(n==null||isNaN(n))?'—':n.toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const fmtDate=s=>s?parseYmd(s).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'2-digit'}):'';
const trimN=n=>(Math.round(n*100)/100).toString().replace('.',',');
const num=v=>parseFloat(String(v).replace(',','.'));
const clone=o=>JSON.parse(JSON.stringify(o));

const UNITS={g:{t:'g',f:1},kg:{t:'g',f:1000},ml:{t:'ml',f:1},l:{t:'ml',f:1000},pz:{t:'pz',f:1}};
function fmtQty(q,t){
  if(t==='g')return q>=1000?trimN(q/1000)+' kg':trimN(q)+' g';
  if(t==='ml')return q>=1000?trimN(q/1000)+' l':trimN(q)+' ml';
  return trimN(q)+' pz';
}
function bestUnit(q,t){
  if(t==='g')return q>=1000?{val:q/1000,unit:'kg'}:{val:q,unit:'g'};
  if(t==='ml')return q>=1000?{val:q/1000,unit:'l'}:{val:q,unit:'ml'};
  return {val:q,unit:'pz'};
}
function fmtPrice(ppb,t){
  if(ppb==null)return '';
  if(t==='g')return fmtEur(ppb*1000)+'/kg';
  if(t==='ml')return fmtEur(ppb*1000)+'/l';
  return fmtEur(ppb)+'/pz';
}
const priceWord=u=>({g:'al kg',ml:'al litro',pz:'al pezzo'})[UNITS[u].t];

/* ---------- stato e salvataggio ---------- */
let S={v:1,inv:[],rec:[],plan:{},prices:[],log:[],cats:[]};
let UI={tab:'inv',invView:'list',q:'',month:new Date(),week:mondayOf(new Date()),showOk:false};
const LS='dispensa_pasti_v1';
function normalizeState(d){
  d=d||{};
  return {v:1,inv:Array.isArray(d.inv)?d.inv:[],rec:Array.isArray(d.rec)?d.rec:[],plan:(d.plan&&typeof d.plan==='object')?d.plan:{},prices:Array.isArray(d.prices)?d.prices:[],log:Array.isArray(d.log)?d.log:[],cats:Array.isArray(d.cats)?d.cats:[]};
}
function loadLocal(){try{const r=localStorage.getItem(LS);if(r)S=normalizeState(JSON.parse(r))}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
const PARTS=['inv','rec','plan','prices','log','cats'];
const wrapP=(k,v)=>k==='plan'?{days:v}:{items:v};
const unwrapP=(k,d)=>clone(k==='plan'?((d&&d.days&&typeof d.days==='object')?d.days:{}):((d&&Array.isArray(d.items))?d.items:[]));
let sdb=null,canWrite=true,lastSaved={},saveTimer=null;
function setStatus(k){
  const el=$('#sync');if(!el)return;
  el.textContent=k==='cloud'?'☁️ condiviso':k==='ro'?'👁 sola lettura':'solo su questo dispositivo';
}
function persist(){
  saveLocal();
  if(sdb&&!canWrite){toast('Sei in sola lettura: serve l\'accesso come Collaboratore');return}
  clearTimeout(saveTimer);saveTimer=setTimeout(flush,600);
}
async function flush(){
  if(!sdb||!canWrite)return;
  let ok=true;
  for(const k of PARTS){
    const j=JSON.stringify(S[k]);
    if(j===lastSaved[k])continue;
    const prev=lastSaved[k];lastSaved[k]=j;
    try{await sdb.doc('shared/'+k).set(wrapP(k,clone(S[k])))}catch(e){lastSaved[k]=prev;ok=false}
  }
  setStatus(ok?'cloud':'local');
}
function softRender(){
  const a=document.activeElement;
  if(document.getElementById('sw')||(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)))return;
  render();
}
function applyRemote(k,snap){
  if(!snap||!snap.exists)return;
  const v=unwrapP(k,snap.data()),j=JSON.stringify(v);
  if(j===lastSaved[k])return;
  lastSaved[k]=j;S[k]=v;saveLocal();softRender();
}
const hasData=x=>PARTS.some(k=>k==='plan'?Object.keys(x.plan).length:x[k].length);
async function connect(){
  try{
    const be=window.__be;if(!be||!be.db)return;
    const db=be.db,user=be.user||null;
    const w=user?await user.can('data.write'):null;
    canWrite=w!==false;sdb=db;
    const snaps=await Promise.all(PARTS.map(k=>db.doc('shared/'+k).get()));
    if(!snaps.some(x=>x.exists)&&canWrite){
      let src=S;
      try{
        const id=user?await user.id():null;
        if(id){const old=await db.doc('data/users/'+id+'/state').get();if(old.exists)src=normalizeState(clone(old.data()))}
      }catch(e){}
      if(hasData(src)){
        S=src;saveLocal();
        for(const k of PARTS){lastSaved[k]=JSON.stringify(S[k]);await db.doc('shared/'+k).set(wrapP(k,clone(S[k])))}
      }
    }
    PARTS.forEach(k=>db.doc('shared/'+k).onSnapshot(x=>applyRemote(k,x),()=>{}));
    setStatus(canWrite?'cloud':'ro');render();
  }catch(e){}
}

/* ---------- logica dati ---------- */
const ingKey=g=>g.cat?'c:'+norm(g.cat):'n:'+norm(g.name||'');
const ingName=g=>g.cat||g.name||'';
const recCats=r=>r?r.ing.map(g=>g.cat?catLabel(g.cat)+(g.flex?' ↔':''):(g.name||'')).join(', '):'';
const invMatch=(g,i)=>g.cat?i.cat===g.cat:norm(i.name)===norm(g.name||'');
function stockFor(g,t,cutoff){
  let tot=0,expired=0;
  for(const i of S.inv){
    if(!invMatch(g,i)||i.t!==t)continue;
    if(cutoff&&i.exp&&i.exp<cutoff){expired+=i.qty;continue}
    tot+=i.qty;
  }
  return {tot,expired};
}
function otherStock(g,t){return S.inv.filter(i=>invMatch(g,i)&&i.t!==t)}
function lastPpb(g,t){
  const l=S.prices.filter(p=>p.t===t&&(g.cat?((p.cat!==undefined?p.cat:guessCat(p.name))===g.cat):norm(p.name)===norm(g.name||''))).sort((a,b)=>a.date<b.date?1:(a.date>b.date?-1:0));
  return l.length?l[0].ppb:null;
}
function recipeCost(r){
  let c=0,missing=0;
  for(const g of r.ing){
    const u=UNITS[g.u];const p=lastPpb(g,u.t);
    if(p==null)missing++;else c+=p*g.q*u.f;
  }
  return {c,missing};
}
function allNames(){
  const s=new Map();
  S.inv.forEach(i=>s.set(norm(i.name),i.name));
  S.rec.forEach(r=>r.ing.forEach(g=>{if(g.name&&!s.has(norm(g.name)))s.set(norm(g.name),g.name)}));
  S.prices.forEach(p=>{if(!s.has(norm(p.name)))s.set(norm(p.name),p.name)});
  return [...s.values()].sort((a,b)=>a.localeCompare(b,'it'));
}
const namesList=()=>'<datalist id="dl-names">'+allNames().map(n=>'<option value="'+esc(n)+'">').join('')+'</datalist>';

/* ---------- UI di base ---------- */
function toast(t){
  const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);
  setTimeout(()=>d.remove(),2200);
}
function openSheet(h){
  const o=$('#sw');if(o)o.remove();
  const w=document.createElement('div');w.className='sw';w.id='sw';
  w.innerHTML='<div class="bd" onclick="closeSheet()"></div><div class="sh">'+h+'</div>';
  document.body.appendChild(w);document.body.style.overflow='hidden';
}
function closeSheet(){RET=null;const w=$('#sw');if(w)w.remove();document.body.style.overflow=''}
function armDelete(btn,fn){
  if(btn.dataset.armed){fn();return}
  btn.dataset.armed='1';const old=btn.textContent;btn.textContent='Tocca ancora per eliminare';
  setTimeout(()=>{btn.dataset.armed='';btn.textContent=old},3000);
}
function go(t){UI.tab=t;render();window.scrollTo(0,0)}
function ensureMealIds(){
  let ch=false;
  Object.keys(S.plan).forEach(k=>S.plan[k].forEach(m=>{if(!m.id){m.id=uid8();ch=true}}));
  if(ch)persist();
}
function render(){
  ensureMealIds();autoCat();
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===UI.tab));
  const v=$('#view');
  const fab=$('#fabslot');fab.innerHTML='';
  if(UI.tab==='inv'){v.innerHTML=viewInv();fab.innerHTML='<button class="fab" aria-label="Aggiungi" onclick="itemForm()">+</button>'}
  else if(UI.tab==='rec'){v.innerHTML=viewRec();fab.innerHTML='<button class="fab" aria-label="Nuova ricetta" onclick="recForm()">+</button>'}
  else if(UI.tab==='plan'){v.innerHTML=viewPlan()}
  else if(UI.tab==='cook'){v.innerHTML=viewCook()}
  else{v.innerHTML=viewShop()}
}

/* ---------- DISPENSA ---------- */
function expInfo(exp){
  if(!exp)return {cls:'',txt:''};
  const today=ymd(new Date());
  const days=Math.round((parseYmd(exp)-parseYmd(today))/86400000);
  if(days<0)return {cls:'bad',txt:'scaduto '+fmtDate(exp)};
  if(days===0)return {cls:'bad',txt:'scade oggi'};
  if(days<=3)return {cls:'warn',txt:'scade tra '+days+' g'};
  return {cls:'',txt:'scade '+fmtDate(exp)};
}
function viewInv(){
  const seg='<div class="seg"><button class="'+(UI.invView==='list'?'on':'')+'" onclick="UI.invView=\'list\';render()">Articoli</button><button class="'+(UI.invView==='price'?'on':'')+'" onclick="UI.invView=\'price\';render()">Prezzi</button></div>';
  if(UI.invView==='price')return seg+viewPrices();
  let val=0,soon=0;
  S.inv.forEach(i=>{if(i.ppb!=null)val+=i.ppb*i.qty;const e=i.exp?Math.round((parseYmd(i.exp)-parseYmd(ymd(new Date())))/86400000):99;if(e<=3)soon++});
  const sum='<div class="sum"><div><b>'+S.inv.length+'</b><span>articoli</span></div><div><b>'+fmtEur(val)+'</b><span>valore stimato</span></div><div><b>'+soon+'</b><span>in scadenza / scaduti</span></div></div>';
  if(!S.inv.length)return seg+'<div class="empty"><b>La dispensa è vuota</b>Tocca il + per aggiungere il primo alimento con quantità, scadenza e prezzo.</div>';
  const q=norm(UI.q||'');
  const list=S.inv.map((i,idx)=>({i,idx})).filter(o=>!q||norm(o.i.name).includes(q)||norm(o.i.cat||'').includes(q))
    .sort((a,b)=>(a.i.exp||'9999')<(b.i.exp||'9999')?-1:((a.i.exp||'9999')>(b.i.exp||'9999')?1:0));
  let h=seg+sum+'<input type="search" placeholder="Cerca…" value="'+esc(UI.q||'')+'" oninput="UI.q=this.value;renderListOnly()" style="margin-bottom:10px"><div id="invlist">'+invRows(list)+'</div>';
  return h;
}
function invRows(list){
  if(!list.length)return '<div class="empty">Nessun risultato</div>';
  return list.map(o=>{
    const i=o.i;const e=expInfo(i.exp);
    return '<div class="card" onclick="itemForm(\''+i.id+'\')"><div class="row"><div class="grow"><div class="title">'+esc(i.name)+'</div><div class="mute">'+(i.cat?esc(catLabel(i.cat)):'⚠️ da categorizzare')+' · '+fmtQty(i.qty,i.t)+(i.ppb!=null?' · '+fmtPrice(i.ppb,i.t):'')+'</div></div>'+(e.txt?'<span class="badge '+e.cls+'">'+e.txt+'</span>':'')+'</div></div>';
  }).join('');
}
function renderListOnly(){
  const q=norm(UI.q||'');
  const list=S.inv.map((i,idx)=>({i,idx})).filter(o=>!q||norm(o.i.name).includes(q)||norm(o.i.cat||'').includes(q))
    .sort((a,b)=>(a.i.exp||'9999')<(b.i.exp||'9999')?-1:((a.i.exp||'9999')>(b.i.exp||'9999')?1:0));
  const el=$('#invlist');if(el)el.innerHTML=invRows(list);
}
let PC=[],PD=[];
function priceData(){
  const cats={};
  const prod=(c,name,t)=>{const o=cats[c]=cats[c]||{};const k=norm(name)+'|'+t;return o[k]=o[k]||{name,t,l:[],inv:[]}};
  S.inv.forEach(i=>prod(i.cat||'',i.name,i.t).inv.push(i));
  S.prices.forEach(p=>{
    const it=S.inv.find(i=>norm(i.name)===norm(p.name)&&i.t===p.t);
    const c=it?(it.cat||''):((p.cat!==undefined?p.cat:guessCat(p.name))||'');
    prod(c,p.name,p.t).l.push(p);
  });
  Object.values(cats).forEach(o=>Object.values(o).forEach(x=>x.l.sort((a,b)=>a.date<b.date?1:(a.date>b.date?-1:0))));
  return cats;
}
function bestPrice(arr,t){

const CATS={
'Proteine':{
 'Carne':['Affettati','Agnello','Coniglio','Hamburger','Maiale','Manzo','Pollo','Salsiccia','Tacchino','Vitello'],
 'Pesce':['Calamaro','Gamberi','Merluzzo','Orata','Tonno'],

 'Legumi':['Ceci','Fagioli','Lenticchie','Piselli'],

'Carboidrati':{
 'Cereali e pasta':['Cous cous','Pasta','Polenta','Riso'],
 'Tuberi':['Gnocchi','Patate'],
 'Pane e forno':['Biscotti','Fette biscottate','Piadina','Pane','Pinsa']},
'Verdure':{
 'Verdure':['Barbabietola','Broccoli','Carote','Cetriolo','Friggitelli','Insalata','Melanzane','Peperoni','Rucola','Verza','Zucca','Zucchine']},
'Frutta':{
 'Frutta':['Albicocca','Ananas','Anguria','Arancia','Banana','Ciliegie','Cocco','Fragole','Kiwi','Limone','Mandarini','Mango','Mela','Melone','Mirtilli','Pera','Pesca','Prugna','Uva']},
};
const OLDCAT={'Carne bianca':'Pollo','Carne rossa':'Manzo'};
const GONE=['Altra carne','Altro pesce','Altri legumi','Altri latticini','Altri carboidrati','Altro'];
const EMO={Arancia:'🍊',Banana:'🍌',Fragole:'🍓',Kiwi:'🥝',Limone:'🍋',Mela:'🍎',Pera:'🍐',Uva:'🍇',Albicocca:'🍑',Ananas:'🍍',Anguria:'🍉',Ciliegie:'🍒',Cocco:'🥥',Mandarini:'🍊',Mango:'🥭',Melone:'🍈',Mirtilli:'🫐',Pesca:'🍑',Prugna:'🍇'};
const catLabel=n=>(EMO[n]?EMO[n]+' ':'')+n;
function allCats(){
  const m={};
  for(const g in CATS){m[g]={};for(const x in CATS[g])m[g][x]=CATS[g][x].slice()}
  (S.cats||[]).forEach(c=>{
    if(!c||!c.g)return;
    m[c.g]=m[c.g]||{};
    if(c.s){m[c.g][c.s]=m[c.g][c.s]||[];if(c.n&&!m[c.g][c.s].includes(c.n))m[c.g][c.s].push(c.n)}
  });
  return m;
}
function catInfo(n){const m=allCats();for(const g in m)for(const x in m[g])if(m[g][x].includes(n))return {g,s:x};return null}
function guessCat(name){
  const nn=norm(name),m=allCats();let best='';
  for(const g in m)for(const x in m[g])for(const c of m[g][x]){const k=norm(c);if(k.length>=3&&nn.includes(k)&&k.length>best.length)best=c}
  return best;
}
function autoCat(){
  let ch=false;
  const fix=o=>{if(o.cat===undefined){o.cat=guessCat(o.name||'');ch=true}else if(OLDCAT[o.cat]){o.cat=OLDCAT[o.cat];ch=true}else if(GONE.includes(o.cat)){o.cat='';ch=true}};
  S.inv.forEach(fix);S.rec.forEach(r=>r.ing.forEach(fix));
  S.prices.forEach(p=>{if(!p.eid){p.eid=uid8();ch=true}});
  S.prices.forEach(p=>{if(!p.iid){const it=S.inv.find(i=>norm(i.name)===norm(p.name)&&i.t===p.t&&Math.abs((i.ppb||0)-p.ppb)<1e-9&&!S.prices.some(q=>q.iid===i.id));if(it){p.iid=it.id;ch=true}}});
  if(ch){saveLocal();if(!sdb||canWrite)persist()}
}

function fillS(g,sel){$('#f-s').innerHTML=opt('','Scegli il sottogruppo…')+Object.keys(allCats()[g]||{}).map(x=>opt(x,x,x===sel)).join('')+opt(ADD,'+ Aggiungi')}

function delCat(kind){
  try{
    const g=$('#f-g').value,x=$('#f-s').value,c=$('#f-c').value,m=allCats();
    const gone=kind==='c'?[c]:(kind==='s'?((m[g]||{})[x]||[]):[].concat(...Object.values(m[g]||{})));
    const used=S.inv.filter(i=>gone.includes(i.cat)).length;
    if(kind==='c')S.cats=S.cats.filter(e=>e.n!==c);
    else if(kind==='s')S.cats=S.cats.filter(e=>!(e.g===g&&e.s===x));
    else S.cats=S.cats.filter(e=>e.g!==g);
    S.inv.forEach(i=>{if(gone.includes(i.cat))i.cat=''});
    S.rec.forEach(r=>r.ing.forEach(n=>{if(gone.includes(n.cat)){n.name=n.name||n.cat;n.cat=''}}));
    S.prices.forEach(p=>{if(gone.includes(p.cat))p.cat=''});
    persist();
    if(kind==='c')fillC(g,x,'');
    else if(kind==='s'){fillS(g,'');fillC(g,'','')}
    else{fillG('');fillS('','');fillC('','','')}
    showAdd('');updDel();
    toast('Eliminato'+(used?' · '+used+' articol'+(used>1?'i':'o')+' ora da categorizzare':''));
  }catch(e){formErr('Errore: '+(e&&e.message||e))}
}

function syncPriceLabel(){
  const u=$('#f-unit').value,m=$('#f-mode');if(!m)return;
  const t=UNITS[u].t,def=t==='pz'?'pz':(t==='g'?'kg':'l');

  m.innerHTML=[['pz','al pezzo'],['kg','al kg'],['l','al litro'],['tot','totale per la quantità']].map(o=>opt(o[0],o[1],o[0]===cur)).join('');
  m.dataset.u=t;syncCont();

  const u=$('#f-unit').value,m=$('#f-mode').value;

function saveItem(id){
  try{
    const name=$('#f-name').value.trim();
    const qv=num($('#f-qty').value);
    const unit=$('#f-unit').value,exp=$('#f-exp').value;
    const pr=num($('#f-price').value),mode=$('#f-mode').value;
    const cat=$('#f-c').value;
    if(!cat||cat===ADD){formErr('Scegli la categoria (gruppo → sottogruppo → categoria)');return}
    if(!name){formErr('Inserisci il nome del prodotto');return}
    if(isNaN(qv)||qv<0){formErr('Inserisci la quantità');return}
    const u=UNITS[unit],qty=qv*u.f,t=u.t;
    let ppb=null;
    if(!isNaN(pr)&&pr>0){
      if(mode==='tot')ppb=qty>0?pr/qty:null;
      else if(mode==='pz'){if(t!=='pz'){formErr('Per il prezzo al pezzo scegli l\'unità pz');return}ppb=pr}
      else{
        const want=mode==='kg'?'g':'ml';
        if(t===want)ppb=pr/1000;
        else if(t==='pz'){const c=num($('#f-cont').value);if(!(c>0)){formErr('Indica il contenuto di 1 pezzo');return}ppb=pr/1000*c}
        else{formErr(mode==='kg'?'Per il prezzo al kg scegli g, kg o pz':'Per il prezzo al litro scegli ml, l o pz');return}
      }
    }
    let iid=id,oldName='',oldT='';
    if(id){const it=S.inv.find(i=>i.id===id);if(it){oldName=it.name;oldT=it.t;Object.assign(it,{name,cat,qty,t,exp:exp||'',ppb})}}
    else{iid=uid8();S.inv.push({id:iid,name,cat,qty,t,exp:exp||'',ppb})}
    S.prices.forEach(p=>{if(p.iid===iid){p.name=name;p.cat=cat}});
    if(ppb!=null){
      let e=null;
      if(id){
        e=S.prices.filter(p=>p.iid===id).sort((a,b)=>a.date<b.date?1:-1)[0]||
          S.prices.filter(p=>!p.iid&&norm(p.name)===norm(oldName)&&p.t===oldT).sort((a,b)=>a.date<b.date?1:-1)[0];
      }
      if(e)Object.assign(e,{name,cat,t,ppb,iid});
      else S.prices.push({name,cat,t,ppb,iid,eid:uid8(),date:ymd(new Date())});
    }
    const back=RET;persist();closeSheet();render();toast('Salvato');if(back)priceReopen(back);
  }catch(e){formErr('Errore nel salvataggio: '+(e&&e.message||e))}
}
function delItem(id){const back=RET;S.inv=S.inv.filter(i=>i.id!==id);if(back)S.prices=S.prices.filter(p=>p.iid!==id);persist();closeSheet();render();if(back)priceReopen(back)}

const scopeOf=cat=>{const inf=cat?catInfo(cat):null;return inf?{g:inf.g,s:inf.s}:null};
const scopeCats=(sc,except)=>((allCats()[sc.g]||{})[sc.s]||[]).filter(c=>c!==except);
const byExp=(a,b)=>(a.exp||'9999')<(b.exp||'9999')?-1:((a.exp||'9999')>(b.exp||'9999')?1:0);
const catExp=(c,t,cutoff)=>S.inv.filter(i=>i.cat===c&&i.t===t&&i.qty>0&&i.exp&&!(i.exp<cutoff)).map(i=>i.exp).sort()[0]||'';
function weekReserved(exceptMid){
  const res={},d0=new Date();
  for(let i=0;i<7;i++){
    (S.plan[ymd(addDays(d0,i))]||[]).forEach(m=>{
      if(m.done||(exceptMid&&m.id===exceptMid))return;
      const r=S.rec.find(x=>x.id===m.rid);if(!r)return;
      const f=m.srv/(r.srv||1);
      r.ing.forEach(g=>{if(!g.cat)return;const u=UNITS[g.u],k=g.cat+'|'+u.t;res[k]=(res[k]||0)+g.q*u.f*f});
    });
  }
  return res;
}
function flexCands(g,t,reserved,today){
  const sc=scopeOf(g.cat),out=[];if(!sc)return out;
  scopeCats(sc,g.cat).forEach(c=>{
    const bs=S.inv.filter(i=>i.cat===c&&i.t===t&&!(i.exp&&i.exp<today)&&i.qty>0).sort(byExp);
    const fr=bs.reduce((a,i)=>a+i.qty,0)-(reserved[c+'|'+t]||0);
    if(fr>1e-9)out.push({cat:c,free:fr,batches:bs});
  });
  return out;
}
function flexCook(l,ci){
  if(!l.flex)return '';
  let h='';
  const st=l.takes.filter(t=>t.sub);
  if(st.length)h+='<div class="mute">al posto di '+esc(l.name)+': '+st.map(t=>{const b=S.inv.find(i=>i.id===t.id);return b?esc(catLabel(b.cat)+' · '+b.name):''}).join(', ')+'</div>';
  const own=l.takes.filter(t=>!t.sub).reduce((a,t)=>a+t.take,0);
  if(l.sub&&l.sub.cands.length&&l.need-own>0.0001){
    const cur=l.sub.ov;
    h+='<select style="margin-top:6px;font-size:14px" onchange="cookSub('+ci+',this.value)"><option value="__auto"'+(cur==='__auto'?' selected':'')+'>Sostituto: automatico (scade prima)</option>'+
      l.sub.cands.map(c=>'<option value="'+esc(c.cat)+'"'+(cur===c.cat?' selected':'')+'>'+esc(catLabel(c.cat))+' · libero '+esc(fmtQty(c.free,l.t))+'</option>').join('')+
      '<option value=""'+(cur===''?' selected':'')+'>Nessun sostituto</option></select>';
  }
  return h;
}
function cookSub(i,v){const p=PENDING;if(!p)return;p.ov[p.keys[i]]=v;cookPreview(p.rid,p.srv,p.k,p.mid,p.ov)}
let PENDING=null;
function calcCook(rid,srv,ov,mid){
  const r=S.rec.find(x=>x.id===rid);if(!r)return null;
  const f=srv/(r.srv||1),today=ymd(new Date()),agg={};
  r.ing.forEach(g=>{
    const u=UNITS[g.u],key=ingKey(g)+'|'+u.t;
    const o=agg[key]=agg[key]||{g,key,name:ingName(g),t:u.t,need:0,flex:false};
    o.need+=g.q*u.f*f;if(g.flex&&g.cat)o.flex=true;
  });
  const vals=Object.values(agg);
  let reserved=null;
  if(vals.some(o=>o.flex)){
    reserved=weekReserved(mid);
    vals.forEach(o=>{if(o.g.cat){const k=o.g.cat+'|'+o.t;reserved[k]=(reserved[k]||0)+o.need}});
  }
  const lines=vals.map(o=>{
    const batches=S.inv.filter(i=>invMatch(o.g,i)&&i.t===o.t&&!(i.exp&&i.exp<today)&&i.qty>0)
      .sort((a,b)=>(a.exp||'9999')<(b.exp||'9999')?-1:((a.exp||'9999')>(b.exp||'9999')?1:0));
    let left=o.need;const takes=[];
    for(const b of batches){if(left<=1e-9)break;const t=Math.min(b.qty,left);takes.push({id:b.id,take:t});left-=t}
    let sub=null;
    if(o.flex&&reserved&&left>0.0001){
      const cands=flexCands(o.g,o.t,reserved,today),ovc=ov&&ov[o.key];
      let pool=cands;
      if(ovc==='')pool=[];else if(ovc&&ovc!=='__auto')pool=cands.filter(c=>c.cat===ovc);
      const items=[];
      pool.forEach(c=>{let rem=c.free;c.batches.forEach(b=>{if(rem<=1e-9)return;const q=Math.min(b.qty,rem);items.push({b,q,cat:c.cat});rem-=q})});
      items.sort((a,b)=>byExp(a.b,b.b));
      for(const it of items){
        if(left<=1e-9)break;
        const t=Math.min(it.q,left);takes.push({id:it.b.id,take:t,sub:true,cat:it.cat});left-=t;
        reserved[it.cat+'|'+o.t]=(reserved[it.cat+'|'+o.t]||0)+t;
      }
      sub={cands:cands.map(c=>({cat:c.cat,free:c.free})),ov:(ovc===undefined?'__auto':ovc)};
    }
    return {key:o.key,flex:o.flex,sub,name:o.name,t:o.t,need:o.need,takes,short:left>0.0001?left:0,other:otherStock(o.g,o.t)};
  });
  return {r,srv,lines};
}
function cookPreview(rid,srv,k,mid,ov){
  srv=Math.max(1,Math.round(num(srv))||1);
  const c=calcCook(rid,srv,ov,mid);if(!c){toast('Ricetta non trovata');return}
  PENDING={rid,srv,k:k||'',mid:mid||'',ov:ov||{},keys:c.lines.map(l=>l.key)};
  let h='<h2>Cucini: '+esc(c.r.name)+'</h2><p class="mute">'+srv+' porzion'+(srv>1?'i':'e')+' · ecco cosa verrà scalato dalla dispensa</p><div class="card">';
  c.lines.forEach((l,ci)=>{
    const taken=l.need-l.short;
    h+='<div class="need"><div class="grow"><div class="title">'+esc(l.name)+'</div>'+(l.takes.some(t=>!t.sub)?'<div class="mute">da '+l.takes.filter(t=>!t.sub).map(t=>{const b=S.inv.find(i=>i.id===t.id);return b?esc(b.name):''}).join(', ')+'</div>':'')+flexCook(l,ci)+
      (l.short>0?'<div class="mute" style="color:var(--warn)">'+(taken>0?'in dispensa ne hai solo '+fmtQty(taken,l.t):'non ce n\'è in dispensa')+(l.other.length?' (ma in un\'altra unità: '+l.other.map(o=>fmtQty(o.qty,o.t)).join(', ')+')':'')+'</div>':'')+
      '</div>'+(taken>0?'<span class="badge">− '+fmtQty(taken,l.t)+'</span>':'<span class="badge warn">nulla da scalare</span>')+'</div>';
  });
  h+='</div>';
  if(c.lines.some(l=>l.short>0))h+='<p class="mute">Scalo solo ciò che c\'è. Gli articoli scaduti non vengono usati.</p>';
  h+='<div style="display:flex;gap:8px;margin-top:10px"><button class="btn grow" onclick="doCook()">Conferma: cucinato ✓</button><button class="btn sec" onclick="closeSheet()">Annulla</button></div>';
  openSheet(h);
}
function doCook(){
  const p=PENDING;if(!p)return;
  const c=calcCook(p.rid,p.srv,p.ov,p.mid);if(!c)return;
  const used=[];
  c.lines.forEach(l=>l.takes.forEach(t=>{
    const it=S.inv.find(i=>i.id===t.id);if(!it)return;
    used.push({snap:clone(it),take:t.take});
    it.qty-=t.take;
    if(it.qty<=1e-6)S.inv=S.inv.filter(i=>i.id!==it.id);
  }));
  const short=c.lines.filter(l=>l.short>0).map(l=>({name:l.name,t:l.t,q:l.short}));
  const id=uid8();
  if(p.k&&p.mid){const m=(S.plan[p.k]||[]).find(x=>x.id===p.mid);if(m)m.done=id}
  S.log.unshift({id,rid:p.rid,name:c.r.name,srv:p.srv,date:ymd(new Date()),k:p.k,mid:p.mid,used,short});
  S.log=S.log.slice(0,60);
  PENDING=null;persist();closeSheet();render();toast('Dispensa aggiornata');
}
function undoCook(id){
  const e=S.log.find(x=>x.id===id);if(!e)return;
  e.used.forEach(u=>{
    const it=S.inv.find(i=>i.id===u.snap.id);
    if(it)it.qty+=u.take;else S.inv.push(Object.assign({},u.snap,{qty:u.take}));
  });
  if(e.k&&e.mid){const m=(S.plan[e.k]||[]).find(x=>x.id===e.mid);if(m&&m.done===id)delete m.done}
  S.log=S.log.filter(x=>x.id!==id);
  persist();render();toast('Annullato: dispensa ripristinata');
}
function cookRecChanged(){
  const s=$('#c-rec');if(!s)return;
  const o=s.options[s.selectedIndex];if(o)$('#c-srv').value=o.dataset.s;
}
function viewCook(){
  const today=ymd(new Date());
  let h='<h3>Pianificati da segnare</h3>';
  const pend=[];
  for(let i=6;i>=0;i--){const k=ymd(addDays(new Date(),-i));(S.plan[k]||[]).forEach(m=>{if(!m.done)pend.push({k,m})})}
  if(!pend.length)h+='<div class="card mute">Nessun pasto da segnare tra oggi e gli ultimi 6 giorni.</div>';
  pend.forEach(o=>{
    const r=S.rec.find(x=>x.id===o.m.rid);if(!r)return;
    const lab=o.k===today?'Oggi':parseYmd(o.k).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'});
    h+='<div class="card"><div class="row"><div class="grow"><div class="title">'+esc(r.name)+'</div><div class="mute">'+lab+' · '+esc(o.m.slot)+' · '+o.m.srv+' porzion'+(o.m.srv>1?'i':'e')+(r?' · '+esc(recCats(r)):'')+'</div></div><button class="btn sm" onclick="cookPreview(\''+o.m.rid+'\','+o.m.srv+',\''+o.k+'\',\''+o.m.id+'\')">Cucinato</button></div></div>';
  });
  h+='<h3>Cucina qualcos\'altro</h3>';
  if(!S.rec.length)h+='<div class="card mute">Crea prima una ricetta nella scheda Ricette.</div>';
  else{
    const rs=S.rec.slice().sort((a,b)=>a.name.localeCompare(b.name,'it'));
    h+='<div class="card"><label style="margin-top:0">Ricetta</label><select id="c-rec" onchange="cookRecChanged()">'+rs.map(r=>'<option value="'+r.id+'" data-s="'+r.srv+'">'+esc(r.name)+'</option>').join('')+'</select>'+
       '<label>Porzioni</label><input id="c-srv" inputmode="numeric" value="'+rs[0].srv+'">'+
       '<button class="btn block" style="margin-top:12px" onclick="cookPreview($(\'#c-rec\').value,$(\'#c-srv\').value)">Segna come cucinato</button></div>';
  }
  h+='<h3>Cucinati di recente</h3>';
  if(!S.log.length)h+='<div class="card mute">Ancora nulla. Quando confermi un pasto, compare qui e puoi annullarlo.</div>';
  S.log.slice(0,15).forEach(e=>{
    h+='<div class="card"><div class="row"><div class="grow"><div class="title">'+esc(e.name)+'</div><div class="mute">'+fmtDate(e.date)+' · '+e.srv+' porzion'+(e.srv>1?'i':'e')+(e.short&&e.short.length?' · '+e.short.length+' ingredienti mancanti in dispensa':'')+'</div></div><button class="btn sm del" onclick="armDelete(this,()=>undoCook(\''+e.id+'\'))">Annulla</button></div></div>';
  });
  return h;
}

/* ---------- SPESA SETTIMANALE ---------- */
let SHOP=[];
function computeShop(startD,endD){
  const need={};let meals=0;
  const startK=ymd(startD),endK=ymd(endD);
  for(let d=new Date(startD);ymd(d)<=endK;d=addDays(d,1)){
    (S.plan[ymd(d)]||[]).forEach(m=>{
      const r=S.rec.find(x=>x.id===m.rid);if(!r||m.done)return;
      meals++;
      const f=m.srv/(r.srv||1);
      r.ing.forEach(g=>{
        const u=UNITS[g.u],key=ingKey(g)+'|'+u.t;
        const o=need[key]=need[key]||{g,name:ingName(g),t:u.t,q:0,fq:0};
        o.q+=g.q*u.f*f;if(g.flex&&g.cat)o.fq+=g.q*u.f*f;
      });
    });
  }
  const nvals=Object.values(need);
  const list=nvals.map(o=>{
    const st=stockFor(o.g,o.t,startK);
    const other=otherStock(o.g,o.t);
    const miss=Math.max(0,o.q-st.tot);
    const p=lastPpb(o.g,o.t);
    return {name:o.name,cat:o.g.cat||'',t:o.t,need:o.q,have:st.tot,expired:st.expired,miss,ppb:p,cost:p!=null?p*miss:null,other};
  });
  if(nvals.some(o=>o.fq>0)){
    const needOf={},usedSub={};
    nvals.forEach(o=>{if(o.g.cat){const k=o.g.cat+'|'+o.t;needOf[k]=(needOf[k]||0)+o.q}});
    nvals.forEach((o,idx)=>{
      const x=list[idx],sc=o.fq>0?scopeOf(o.g.cat):null;if(!sc)return;
      x.flexSub=sc.s;x.subs=[];
      if(!(x.miss>0.0001))return;
      let want=Math.min(x.miss,o.fq);
      const cands=scopeCats(sc,o.g.cat).map(c=>{
        const k=c+'|'+o.t;
        return {cat:c,k,sur:stockFor({cat:c},o.t,startK).tot-(needOf[k]||0)-(usedSub[k]||0),exp:catExp(c,o.t,startK)};
      }).filter(c=>c.sur>1e-9).sort((a,b)=>(a.exp||'9999')<(b.exp||'9999')?-1:((a.exp||'9999')>(b.exp||'9999')?1:0));
      for(const c of cands){
        if(want<=1e-9)break;
        const q=Math.min(c.sur,want);x.subs.push({cat:c.cat,q});usedSub[c.k]=(usedSub[c.k]||0)+q;want-=q;
      }
      const cov=x.subs.reduce((a,e)=>a+e.q,0);
      if(cov>0){x.miss=Math.max(0,x.miss-cov);x.cost=x.ppb!=null?x.ppb*x.miss:null}
    });
  }
  list.sort((a,b)=>a.name.localeCompare(b.name,'it'));
  return {list,meals};
}
function viewShop(){
  const ws=UI.week,we=addDays(ws,6);
  const lbl=ws.toLocaleDateString('it-IT',{day:'numeric',month:'short'})+' – '+we.toLocaleDateString('it-IT',{day:'numeric',month:'short'});
  const isThis=ymd(ws)===ymd(mondayOf(new Date()));
  let h='<div class="mnav"><button onclick="weekGo(-1)">‹</button><b style="text-transform:none">'+(isThis?'Questa settimana · ':'')+lbl+'</b><button onclick="weekGo(1)">›</button></div>';
  const r=computeShop(ws,we);SHOP=r.list;
  if(!r.meals)return h+'<div class="empty"><b>Nessun pasto in questa settimana</b>Assegna le ricette ai giorni nella scheda Piano e qui comparirà la lista della spesa.</div>';
  const buy=r.list.filter(x=>x.miss>0.0001),ok=r.list.filter(x=>x.miss<=0.0001);
  const tot=buy.reduce((s,x)=>s+(x.cost||0),0),unk=buy.filter(x=>x.cost==null).length;
  h+='<div class="sum"><div><b>'+r.meals+'</b><span>pasti</span></div><div><b>'+buy.length+'</b><span>da comprare</span></div><div><b>'+fmtEur(tot)+'</b><span>costo stimato'+(unk?'*':'')+'</span></div></div>';
  if(buy.length){
    h+='<h3>Da comprare</h3><div class="card">';
    buy.forEach(x=>{
      const i=SHOP.indexOf(x);
      h+='<div class="need"><div class="grow"><div class="title">'+esc(x.name)+'</div><div class="mute">serve '+fmtQty(x.need,x.t)+' · in dispensa '+fmtQty(x.have,x.t)+(x.expired>0?' (+'+fmtQty(x.expired,x.t)+' scaduto)':'')+'</div>'+
        (x.other.length?'<div class="mute" style="color:var(--warn)">hai questo alimento in un\'altra unità ('+x.other.map(o=>fmtQty(o.qty,o.t)).join(', ')+'): controlla</div>':'')+
        (x.subs&&x.subs.length?'<div class="mute">in parte coperto con ↔ '+x.subs.map(e=>esc(catLabel(e.cat))+' ('+fmtQty(e.q,x.t)+')').join(', ')+'</div>':'')+
        (x.flexSub?'<div class="mute">va bene anche altro in «'+esc(x.flexSub)+'»</div>':'')+'</div>'+
        '<div style="text-align:right"><span class="badge bad">manca '+fmtQty(x.miss,x.t)+'</span>'+(x.cost!=null?'<div class="mute">≈ '+fmtEur(x.cost)+'</div>':'')+'</div>'+
        '<button class="btn sm sec" onclick="shopAdd('+i+')" aria-label="Aggiungi alla dispensa">＋</button></div>';
    });
    h+='</div>';
    if(unk)h+='<p class="mute">* alcuni ingredienti non hanno ancora un prezzo registrato.</p>';
    h+='<button class="btn block" onclick="copyShop()">Copia / condividi la lista</button>';
  }else h+='<div class="card" style="text-align:center"><b>🎉 Hai già tutto!</b><div class="mute">Gli ingredienti della settimana sono tutti in dispensa.</div></div>';
  if(ok.length){
    h+='<h3 onclick="UI.showOk=!UI.showOk;render()" style="cursor:pointer">Già disponibili ('+ok.length+') '+(UI.showOk?'▾':'▸')+'</h3>';
    if(UI.showOk){
      h+='<div class="card">';
      ok.forEach(x=>{h+='<div class="need"><div class="grow"><div class="title">'+esc(x.name)+'</div><div class="mute">serve '+fmtQty(x.need,x.t)+' · hai '+fmtQty(x.have,x.t)+'</div>'+(x.subs&&x.subs.length?'<div class="mute">coperto con ↔ '+x.subs.map(e=>esc(catLabel(e.cat))+' ('+fmtQty(e.q,x.t)+')').join(', ')+'</div>':'')+'</div><span class="badge ok">ok</span></div>'});
      h+='</div>';
    }
  }
  return h;
}
function weekGo(n){UI.week=addDays(UI.week,7*n);render()}
function shopAdd(i){
  const x=SHOP[i];if(!x)return;
  itemForm({name:x.cat?'':x.name,cat:x.cat,qty:Math.ceil(x.miss),t:x.t,ppb:x.ppb});
}
async function copyShop(){
  const buy=SHOP.filter(x=>x.miss>0.0001);
  const text='Lista della spesa\n'+buy.map(x=>'□ '+x.name+' — '+fmtQty(Math.ceil(x.miss),x.t)).join('\n');
  try{
    if(navigator.share){await navigator.share({text});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(text);toast('Lista copiata')}
  catch(e){
    openSheet('<h2>Lista della spesa</h2><textarea style="width:100%;height:220px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:10px" readonly>'+esc(text)+'</textarea><button class="btn sec block" style="margin-top:10px" onclick="closeSheet()">Chiudi</button>');
  }
}

/* ---------- avvio ---------- */
loadLocal();render();
</script>
