<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dispensa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#faf7f2">
<link rel="manifest" href="manifest.json">
<title>Dispensa & Pasti</title>
<style>
:root{--bg:#faf7f2;--card:#ffffff;--ink:#241f1a;--mute:#7a6f63;--line:#e8e1d6;--acc:#2f6b4f;--acc-ink:#ffffff;--warn:#b4530a;--warnbg:#fff1e3;--ok:#2f6b4f;--okbg:#e5f2ea;--bad:#b42318;--badbg:#fdecea;--chip:#f1ece3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#171512;--card:#221f1b;--ink:#f1ece4;--mute:#a79c8e;--line:#35302a;--acc:#5fb98c;--acc-ink:#0f1f17;--warn:#f0a35e;--warnbg:#3a2a1a;--ok:#5fb98c;--okbg:#1c2e25;--bad:#f28b82;--badbg:#3a1f1d;--chip:#2c2823}}
:root[data-theme="dark"]{--bg:#171512;--card:#221f1b;--ink:#f1ece4;--mute:#a79c8e;--line:#35302a;--acc:#5fb98c;--acc-ink:#0f1f17;--warn:#f0a35e;--warnbg:#3a2a1a;--ok:#5fb98c;--okbg:#1c2e25;--bad:#f28b82;--badbg:#3a1f1d;--chip:#2c2823}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;max-width:640px;margin:0 auto;padding-bottom:84px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
header h1{font-size:22px;margin:0;font-family:Georgia,"Times New Roman",serif;letter-spacing:-.2px}
.sync{font-size:12px;color:var(--mute);background:var(--chip);padding:3px 9px;border-radius:99px}
main{padding:6px 14px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.mute{color:var(--mute);font-size:13px}
.title{font-weight:600}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.sum b{display:block;font-size:18px}
.sum span{font-size:12px;color:var(--mute)}
input,select,button,textarea{font:inherit;color:inherit}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);min-height:44px}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--acc);color:var(--acc-ink);font-weight:600;min-height:44px;cursor:pointer}
.btn.sec{background:var(--chip);color:var(--ink)}
.btn.del{background:var(--badbg);color:var(--bad)}
.btn.sm{padding:7px 12px;min-height:34px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--mute);white-space:nowrap}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.bad{background:var(--badbg);color:var(--bad)}
.badge.ok{background:var(--okbg);color:var(--ok)}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;margin:0 0 12px}
.seg button{flex:1;border:0;background:transparent;padding:8px;border-radius:10px;font-weight:600;color:var(--mute);min-height:38px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20;max-width:640px;margin:0 auto}
.tabs button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--mute);font-size:11px;font-weight:600;min-height:48px}
.tabs button span{font-size:21px;line-height:1}
.tabs button.on{color:var(--acc)}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--acc);color:var(--acc-ink);font-size:30px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:15}
.sw{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end}
.bd{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sh{position:relative;background:var(--bg);border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;max-width:640px;width:100%;margin:0 auto}
.sh h2{margin:0 0 4px;font-size:19px;font-family:Georgia,serif}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px;align-items:center;margin-bottom:6px}
.empty{text-align:center;color:var(--mute);padding:34px 18px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11px;text-align:center;color:var(--mute);padding:4px 0}
.day{aspect-ratio:1/1.05;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:4px 5px;display:flex;flex-direction:column;justify-content:space-between;font-size:14px;cursor:pointer;min-width:0}
.day.out{opacity:.35}
.day.today{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.day .n{font-weight:600}
.day .cnt{align-self:flex-end;font-size:11px;background:var(--acc);color:var(--acc-ink);border-radius:99px;padding:0 7px;font-weight:700}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.mnav b{text-transform:capitalize;font-size:17px}
.mnav button{border:0;background:var(--chip);border-radius:10px;width:44px;height:40px;font-size:18px;color:var(--ink)}
.need{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.need:last-child{border-bottom:0}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);margin:16px 2px 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:99;max-width:90%}
.x{border:0;background:var(--badbg);color:var(--bad);border-radius:10px;min-height:44px;font-size:18px}
</style>
</head>
<body>
<header><h1>Dispensa &amp; Pasti</h1><span class="sync" id="sync">solo su questo dispositivo</span></header>
<main id="view"></main>
<div id="fabslot"></div>
<nav class="tabs" id="tabs">
  <button data-t="inv" onclick="go('inv')"><span>🥫</span>Dispensa</button>
  <button data-t="rec" onclick="go('rec')"><span>📖</span>Ricette</button>
  <button data-t="plan" onclick="go('plan')"><span>🗓️</span>Piano</button>
  <button data-t="cook" onclick="go('cook')"><span>🍳</span>Cucina</button>
  <button data-t="shop" onclick="go('shop')"><span>🛒</span>Spesa</button>
</nav>

<script>
/* ---------- utilità ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid8=()=>Math.random().toString(36).slice(2,10);
const norm=s=>String(s).trim().toLowerCase().replace(/\s+/g,' ');
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addDays(x,-((x.getDay()+6)%7))};
const fmtEur=n=>(n==null||isNaN(n))?'—':n.toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const fmtDate=s=>s?parseYmd(s).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'2-digit'}):'';
const trimN=n=>(Math.round(n*100)/100).toString().replace('.',',');
const num=v=>parseFloat(String(v).replace(',','.'));
const clone=o=>JSON.parse(JSON.stringify(o));

const UNITS={g:{t:'g',f:1},kg:{t:'g',f:1000},ml:{t:'ml',f:1},l:{t:'ml',f:1000},pz:{t:'pz',f:1}};
function fmtQty(q,t){
  if(t==='g')return q>=1000?trimN(q/1000)+' kg':trimN(q)+' g';
  if(t==='ml')return q>=1000?trimN(q/1000)+' l':trimN(q)+' ml';
  return trimN(q)+' pz';
}
function bestUnit(q,t){
  if(t==='g')return q>=1000?{val:q/1000,unit:'kg'}:{val:q,unit:'g'};
  if(t==='ml')return q>=1000?{val:q/1000,unit:'l'}:{val:q,unit:'ml'};
  return {val:q,unit:'pz'};
}
function fmtPrice(ppb,t){
  if(ppb==null)return '';
  if(t==='g')return fmtEur(ppb*1000)+'/kg';
  if(t==='ml')return fmtEur(ppb*1000)+'/l';
  return fmtEur(ppb)+'/pz';
}
const priceWord=u=>({g:'al kg',ml:'al litro',pz:'al pezzo'})[UNITS[u].t];

/* ---------- stato e salvataggio ---------- */
let S={v:1,inv:[],rec:[],plan:{},prices:[],log:[]};
let UI={tab:'inv',invView:'list',q:'',month:new Date(),week:mondayOf(new Date()),showOk:false};
const LS='dispensa_pasti_v1';
function normalizeState(d){
  d=d||{};
  return {v:1,inv:Array.isArray(d.inv)?d.inv:[],rec:Array.isArray(d.rec)?d.rec:[],plan:(d.plan&&typeof d.plan==='object')?d.plan:{},prices:Array.isArray(d.prices)?d.prices:[],log:Array.isArray(d.log)?d.log:[]};
}
function loadLocal(){try{const r=localStorage.getItem(LS);if(r)S=normalizeState(JSON.parse(r))}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
const PARTS=['inv','rec','plan','prices','log'];
const wrapP=(k,v)=>k==='plan'?{days:v}:{items:v};
const unwrapP=(k,d)=>k==='plan'?((d&&d.days&&typeof d.days==='object')?d.days:{}):((d&&Array.isArray(d.items))?d.items:[]);
let sdb=null,canWrite=true,lastSaved={},saveTimer=null;
function setStatus(k){
  const el=$('#sync');if(!el)return;
  el.textContent=k==='cloud'?'☁️ condiviso':k==='ro'?'👁 sola lettura':'solo su questo dispositivo';
}
function persist(){
  saveLocal();
  if(sdb&&!canWrite){toast('Sei in sola lettura: serve l\'accesso come Collaboratore');return}
  clearTimeout(saveTimer);saveTimer=setTimeout(flush,600);
}
async function flush(){
  if(!sdb||!canWrite)return;
  let ok=true;
  for(const k of PARTS){
    const j=JSON.stringify(S[k]);
    if(j===lastSaved[k])continue;
    const prev=lastSaved[k];lastSaved[k]=j;
    try{await sdb.doc('shared/'+k).set(wrapP(k,clone(S[k])))}catch(e){lastSaved[k]=prev;ok=false}
  }
  setStatus(ok?'cloud':'local');
}
function softRender(){
  const a=document.activeElement;
  if(document.getElementById('sw')||(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)))return;
  render();
}
function applyRemote(k,snap){
  if(!snap||!snap.exists)return;
  const v=unwrapP(k,snap.data()),j=JSON.stringify(v);
  if(j===lastSaved[k])return;
  lastSaved[k]=j;S[k]=v;saveLocal();softRender();
}
const hasData=x=>PARTS.some(k=>k==='plan'?Object.keys(x.plan).length:x[k].length);
async function connect(){
  try{
    if(!(window.claude&&window.claude.use))return;
    const db=await claude.use('db');
    if(!db)return;
    const user=await claude.use('user');
    const w=user?await user.can('data.write'):null;
    canWrite=w!==false;sdb=db;
    const snaps=await Promise.all(PARTS.map(k=>db.doc('shared/'+k).get()));
    if(!snaps.some(x=>x.exists)&&canWrite){
      let src=S;
      try{
        const id=user?await user.id():null;
        if(id){const old=await db.doc('data/users/'+id+'/state').get();if(old.exists)src=normalizeState(old.data())}
      }catch(e){}
      if(hasData(src)){
        S=src;saveLocal();
        for(const k of PARTS){lastSaved[k]=JSON.stringify(S[k]);await db.doc('shared/'+k).set(wrapP(k,clone(S[k])))}
      }
    }
    PARTS.forEach(k=>db.doc('shared/'+k).onSnapshot(x=>applyRemote(k,x),()=>{}));
    setStatus(canWrite?'cloud':'ro');render();
  }catch(e){}
}

/* ---------- logica dati ---------- */
function stockFor(name,t,cutoff){
  let tot=0,expired=0;
  for(const i of S.inv){
    if(norm(i.name)!==norm(name)||i.t!==t)continue;
    if(cutoff&&i.exp&&i.exp<cutoff){expired+=i.qty;continue}
    tot+=i.qty;
  }
  return {tot,expired};
}
function otherStock(name,t){return S.inv.filter(i=>norm(i.name)===norm(name)&&i.t!==t)}
function lastPpb(name,t){
  const l=S.prices.filter(p=>norm(p.name)===norm(name)&&p.t===t).sort((a,b)=>a.date<b.date?1:(a.date>b.date?-1:0));
  return l.length?l[0].ppb:null;
}
function recipeCost(r){
  let c=0,missing=0;
  for(const g of r.ing){
    const u=UNITS[g.u];const p=lastPpb(g.name,u.t);
    if(p==null)missing++;else c+=p*g.q*u.f;
  }
  return {c,missing};
}
function allNames(){
  const s=new Map();
  S.inv.forEach(i=>s.set(norm(i.name),i.name));
  S.rec.forEach(r=>r.ing.forEach(g=>{if(!s.has(norm(g.name)))s.set(norm(g.name),g.name)}));
  S.prices.forEach(p=>{if(!s.has(norm(p.name)))s.set(norm(p.name),p.name)});
  return [...s.values()].sort((a,b)=>a.localeCompare(b,'it'));
}
const namesList=()=>'<datalist id="dl-names">'+allNames().map(n=>'<option value="'+esc(n)+'">').join('')+'</datalist>';

/* ---------- UI di base ---------- */
function toast(t){
  const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);
  setTimeout(()=>d.remove(),2200);
}
function openSheet(h){
  closeSheet();
  const w=document.createElement('div');w.className='sw';w.id='sw';
  w.innerHTML='<div class="bd" onclick="closeSheet()"></div><div class="sh">'+h+'</div>';
  document.body.appendChild(w);document.body.style.overflow='hidden';
}
function closeSheet(){const w=$('#sw');if(w)w.remove();document.body.style.overflow=''}
function armDelete(btn,fn){
  if(btn.dataset.armed){fn();return}
  btn.dataset.armed='1';const old=btn.textContent;btn.textContent='Tocca ancora per eliminare';
  setTimeout(()=>{btn.dataset.armed='';btn.textContent=old},3000);
}
function go(t){UI.tab=t;render();window.scrollTo(0,0)}
function ensureMealIds(){
  let ch=false;
  Object.keys(S.plan).forEach(k=>S.plan[k].forEach(m=>{if(!m.id){m.id=uid8();ch=true}}));
  if(ch)persist();
}
function render(){
  ensureMealIds();
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===UI.tab));
  const v=$('#view');
  const fab=$('#fabslot');fab.innerHTML='';
  if(UI.tab==='inv'){v.innerHTML=viewInv();fab.innerHTML='<button class="fab" aria-label="Aggiungi" onclick="itemForm()">+</button>'}
  else if(UI.tab==='rec'){v.innerHTML=viewRec();fab.innerHTML='<button class="fab" aria-label="Nuova ricetta" onclick="recForm()">+</button>'}
  else if(UI.tab==='plan'){v.innerHTML=viewPlan()}
  else if(UI.tab==='cook'){v.innerHTML=viewCook()}
  else{v.innerHTML=viewShop()}
}

/* ---------- DISPENSA ---------- */
function expInfo(exp){
  if(!exp)return {cls:'',txt:''};
  const today=ymd(new Date());
  const days=Math.round((parseYmd(exp)-parseYmd(today))/86400000);
  if(days<0)return {cls:'bad',txt:'scaduto '+fmtDate(exp)};
  if(days===0)return {cls:'bad',txt:'scade oggi'};
  if(days<=3)return {cls:'warn',txt:'scade tra '+days+' g'};
  return {cls:'',txt:'scade '+fmtDate(exp)};
}
function viewInv(){
  const seg='<div class="seg"><button class="'+(UI.invView==='list'?'on':'')+'" onclick="UI.invView=\'list\';render()">Articoli</button><button class="'+(UI.invView==='price'?'on':'')+'" onclick="UI.invView=\'price\';render()">Prezzi</button></div>';
  if(UI.invView==='price')return seg+viewPrices();
  let val=0,soon=0;
  S.inv.forEach(i=>{if(i.ppb!=null)val+=i.ppb*i.qty;const e=i.exp?Math.round((parseYmd(i.exp)-parseYmd(ymd(new Date())))/86400000):99;if(e<=3)soon++});
  const sum='<div class="sum"><div><b>'+S.inv.length+'</b><span>articoli</span></div><div><b>'+fmtEur(val)+'</b><span>valore stimato</span></div><div><b>'+soon+'</b><span>in scadenza / scaduti</span></div></div>';
  if(!S.inv.length)return seg+'<div class="empty"><b>La dispensa è vuota</b>Tocca il + per aggiungere il primo alimento con quantità, scadenza e prezzo.</div>';
  const q=norm(UI.q||'');
  const list=S.inv.map((i,idx)=>({i,idx})).filter(o=>!q||norm(o.i.name).includes(q))
    .sort((a,b)=>(a.i.exp||'9999')<(b.i.exp||'9999')?-1:((a.i.exp||'9999')>(b.i.exp||'9999')?1:0));
  let h=seg+sum+'<input type="search" placeholder="Cerca…" value="'+esc(UI.q||'')+'" oninput="UI.q=this.value;renderListOnly()" style="margin-bottom:10px"><div id="invlist">'+invRows(list)+'</div>';
  return h;
}
function invRows(list){
  if(!list.length)return '<div class="empty">Nessun risultato</div>';
  return list.map(o=>{
    const i=o.i;const e=expInfo(i.exp);
    return '<div class="card" onclick="itemForm(\''+i.id+'\')"><div class="row"><div class="grow"><div class="title">'+esc(i.name)+'</div><div class="mute">'+fmtQty(i.qty,i.t)+(i.ppb!=null?' · '+fmtPrice(i.ppb,i.t):'')+'</div></div>'+(e.txt?'<span class="badge '+e.cls+'">'+e.txt+'</span>':'')+'</div></div>';
  }).join('');
}
function renderListOnly(){
  const q=norm(UI.q||'');
  const list=S.inv.map((i,idx)=>({i,idx})).filter(o=>!q||norm(o.i.name).includes(q))
    .sort((a,b)=>(a.i.exp||'9999')<(b.i.exp||'9999')?-1:((a.i.exp||'9999')>(b.i.exp||'9999')?1:0));
  const el=$('#invlist');if(el)el.innerHTML=invRows(list);
}
function viewPrices(){
  const g={};
  S.prices.forEach(p=>{const k=norm(p.name)+'|'+p.t;(g[k]=g[k]||{name:p.name,t:p.t,l:[]}).l.push(p)});
  const arr=Object.values(g).sort((a,b)=>a.name.localeCompare(b.name,'it'));
  if(!arr.length)return '<div class="empty"><b>Nessun prezzo registrato</b>Quando inserisci un articolo con il prezzo, qui compare lo storico per ogni alimento.</div>';
  return arr.map(x=>{
    x.l.sort((a,b)=>a.date<b.date?1:(a.date>b.date?-1:0));
    const last=x.l[0],prev=x.l[1];
    const avg=x.l.reduce((s,p)=>s+p.ppb,0)/x.l.length;
    const min=Math.min(...x.l.map(p=>p.ppb));
    let trend='';
    if(prev){const d=last.ppb-prev.ppb;trend=d>0.0000001?'<span class="badge bad">▲ rispetto a prima</span>':(d<-0.0000001?'<span class="badge ok">▼ rispetto a prima</span>':'')}
    return '<div class="card"><div class="row"><div class="grow"><div class="title">'+esc(x.name)+'</div><div class="mute">ultimo '+fmtPrice(last.ppb,x.t)+' ('+fmtDate(last.date)+')</div><div class="mute">medio '+fmtPrice(avg,x.t)+' · minimo '+fmtPrice(min,x.t)+' · '+x.l.length+' acquist'+(x.l.length>1?'i':'o')+'</div></div>'+trend+'</div></div>';
  }).join('');
}
function itemForm(arg){
  let it={};
  if(typeof arg==='string')it=S.inv.find(i=>i.id===arg)||{};
  else if(arg&&typeof arg==='object')it=arg;
  const edit=!!it.id;
  const bu=it.qty!=null?bestUnit(it.qty,it.t):{val:'',unit:'g'};
  const val=bu.val===''?'':+(+bu.val).toFixed(3);
  const pv=it.ppb!=null?+(it.ppb*(it.t==='pz'?1:1000)).toFixed(4):'';
  const uopts=['g','kg','ml','l','pz'].map(u=>'<option value="'+u+'"'+(u===bu.unit?' selected':'')+'>'+u+'</option>').join('');

/* ---------- CUCINA (scala la dispensa) ---------- */
let PENDING=null;
function calcCook(rid,srv){
  const r=S.rec.find(x=>x.id===rid);if(!r)return null;
  const f=srv/(r.srv||1),today=ymd(new Date()),agg={};
  r.ing.forEach(g=>{
    const u=UNITS[g.u],key=norm(g.name)+'|'+u.t;
    const o=agg[key]=agg[key]||{name:g.name,t:u.t,need:0};
    o.need+=g.q*u.f*f;
  });
  const lines=Object.values(agg).map(o=>{
    const batches=S.inv.filter(i=>norm(i.name)===norm(o.name)&&i.t===o.t&&!(i.exp&&i.exp<today)&&i.qty>0)
      .sort((a,b)=>(a.exp||'9999')<(b.exp||'9999')?-1:((a.exp||'9999')>(b.exp||'9999')?1:0));
    let left=o.need;const takes=[];
    for(const b of batches){if(left<=1e-9)break;const t=Math.min(b.qty,left);takes.push({id:b.id,take:t});left-=t}
    return {name:o.name,t:o.t,need:o.need,takes,short:left>0.0001?left:0,other:otherStock(o.name,o.t)};
  });
  return {r,srv,lines};
}
function cookPreview(rid,srv,k,mid){
  srv=Math.max(1,Math.round(num(srv))||1);
  const c=calcCook(rid,srv);if(!c){toast('Ricetta non trovata');return}
  PENDING={rid,srv,k:k||'',mid:mid||''};
  let h='<h2>Cucini: '+esc(c.r.name)+'</h2><p class="mute">'+srv+' porzion'+(srv>1?'i':'e')+' · ecco cosa verrà scalato dalla dispensa</p><div class="card">';
  c.lines.forEach(l=>{
    const taken=l.need-l.short;
    h+='<div class="need"><div class="grow"><div class="title">'+esc(l.name)+'</div>'+
      (l.short>0?'<div class="mute" style="color:var(--warn)">'+(taken>0?'in dispensa ne hai solo '+fmtQty(taken,l.t):'non ce n\'è in dispensa')+(l.other.length?' (ma in un\'altra unità: '+l.other.map(o=>fmtQty(o.qty,o.t)).join(', ')+')':'')+'</div>':'')+
      '</div>'+(taken>0?'<span class="badge">− '+fmtQty(taken,l.t)+'</span>':'<span class="badge warn">nulla da scalare</span>')+'</div>';
  });
  h+='</div>';
  if(c.lines.some(l=>l.short>0))h+='<p class="mute">Scalo solo ciò che c\'è. Gli articoli scaduti non vengono usati.</p>';
  h+='<div style="display:flex;gap:8px;margin-top:10px"><button class="btn grow" onclick="doCook()">Conferma: cucinato ✓</button><button class="btn sec" onclick="closeSheet()">Annulla</button></div>';
  openSheet(h);
}
function doCook(){
  const p=PENDING;if(!p)return;
  const c=calcCook(p.rid,p.srv);if(!c)return;
  const used=[];
  c.lines.forEach(l=>l.takes.forEach(t=>{
    const it=S.inv.find(i=>i.id===t.id);if(!it)return;
    used.push({snap:clone(it),take:t.take});
    it.qty-=t.take;
    if(it.qty<=1e-6)S.inv=S.inv.filter(i=>i.id!==it.id);
  }));
  const short=c.lines.filter(l=>l.short>0).map(l=>({name:l.name,t:l.t,q:l.short}));
  const id=uid8();
  if(p.k&&p.mid){const m=(S.plan[p.k]||[]).find(x=>x.id===p.mid);if(m)m.done=id}
  S.log.unshift({id,rid:p.rid,name:c.r.name,srv:p.srv,date:ymd(new Date()),k:p.k,mid:p.mid,used,short});
  S.log=S.log.slice(0,60);
  PENDING=null;persist();closeSheet();render();toast('Dispensa aggiornata');
}
function undoCook(id){
  const e=S.log.find(x=>x.id===id);if(!e)return;
  e.used.forEach(u=>{
    const it=S.inv.find(i=>i.id===u.snap.id);
    if(it)it.qty+=u.take;else S.inv.push(Object.assign({},u.snap,{qty:u.take}));
  });
  if(e.k&&e.mid){const m=(S.plan[e.k]||[]).find(x=>x.id===e.mid);if(m&&m.done===id)delete m.done}
  S.log=S.log.filter(x=>x.id!==id);
  persist();render();toast('Annullato: dispensa ripristinata');
}

  });
  return h;

/* ---------- SPESA SETTIMANALE ---------- */
let SHOP=[];
function computeShop(startD,endD){
  const need={};let meals=0;
  const startK=ymd(startD),endK=ymd(endD);
  for(let d=new Date(startD);ymd(d)<=endK;d=addDays(d,1)){
    (S.plan[ymd(d)]||[]).forEach(m=>{
      const r=S.rec.find(x=>x.id===m.rid);if(!r||m.done)return;
      meals++;
      const f=m.srv/(r.srv||1);
      r.ing.forEach(g=>{
        const u=UNITS[g.u],key=norm(g.name)+'|'+u.t;
        const o=need[key]=need[key]||{name:g.name,t:u.t,q:0};
        o.q+=g.q*u.f*f;
      });
    });
  }
  const list=Object.values(need).map(o=>{
    const st=stockFor(o.name,o.t,startK);
    const other=otherStock(o.name,o.t);
    const miss=Math.max(0,o.q-st.tot);
    const p=lastPpb(o.name,o.t);
    return {name:o.name,t:o.t,need:o.q,have:st.tot,expired:st.expired,miss,ppb:p,cost:p!=null?p*miss:null,other};
  });
  list.sort((a,b)=>a.name.localeCompare(b.name,'it'));
  return {list,meals};
}
function viewShop(){
  const ws=UI.week,we=addDays(ws,6);
  const lbl=ws.toLocaleDateString('it-IT',{day:'numeric',month:'short'})+' – '+we.toLocaleDateString('it-IT',{day:'numeric',month:'short'});
  const isThis=ymd(ws)===ymd(mondayOf(new Date()));
  let h='<div class="mnav"><button onclick="weekGo(-1)">‹</button><b style="text-transform:none">'+(isThis?'Questa settimana · ':'')+lbl+'</b><button onclick="weekGo(1)">›</button></div>';
  const r=computeShop(ws,we);SHOP=r.list;
  if(!r.meals)return h+'<div class="empty"><b>Nessun pasto in questa settimana</b>Assegna le ricette ai giorni nella scheda Piano e qui comparirà la lista della spesa.</div>';
  const buy=r.list.filter(x=>x.miss>0.0001),ok=r.list.filter(x=>x.miss<=0.0001);
  const tot=buy.reduce((s,x)=>s+(x.cost||0),0),unk=buy.filter(x=>x.cost==null).length;
  h+='<div class="sum"><div><b>'+r.meals+'</b><span>pasti</span></div><div><b>'+buy.length+'</b><span>da comprare</span></div><div><b>'+fmtEur(tot)+'</b><span>costo stimato'+(unk?'*':'')+'</span></div></div>';
  if(buy.length){
    h+='<h3>Da comprare</h3><div class="card">';
    buy.forEach(x=>{
      const i=SHOP.indexOf(x);
      h+='<div class="need"><div class="grow"><div class="title">'+esc(x.name)+'</div><div class="mute">serve '+fmtQty(x.need,x.t)+' · in dispensa '+fmtQty(x.have,x.t)+(x.expired>0?' (+'+fmtQty(x.expired,x.t)+' scaduto)':'')+'</div>'+
        (x.other.length?'<div class="mute" style="color:var(--warn)">hai questo alimento in un\'altra unità ('+x.other.map(o=>fmtQty(o.qty,o.t)).join(', ')+'): controlla</div>':'')+'</div>'+
        '<div style="text-align:right"><span class="badge bad">manca '+fmtQty(x.miss,x.t)+'</span>'+(x.cost!=null?'<div class="mute">≈ '+fmtEur(x.cost)+'</div>':'')+'</div>'+
        '<button class="btn sm sec" onclick="shopAdd('+i+')" aria-label="Aggiungi alla dispensa">＋</button></div>';
    });
    h+='</div>';
    if(unk)h+='<p class="mute">* alcuni ingredienti non hanno ancora un prezzo registrato.</p>';
    h+='<button class="btn block" onclick="copyShop()">Copia / condividi la lista</button>';
  }else h+='<div class="card" style="text-align:center"><b>🎉 Hai già tutto!</b><div class="mute">Gli ingredienti della settimana sono tutti in dispensa.</div></div>';
  if(ok.length){
    h+='<h3 onclick="UI.showOk=!UI.showOk;render()" style="cursor:pointer">Già disponibili ('+ok.length+') '+(UI.showOk?'▾':'▸')+'</h3>';
    if(UI.showOk){
      h+='<div class="card">';
      ok.forEach(x=>{h+='<div class="need"><div class="grow"><div class="title">'+esc(x.name)+'</div><div class="mute">serve '+fmtQty(x.need,x.t)+' · hai '+fmtQty(x.have,x.t)+'</div></div><span class="badge ok">ok</span></div>'});
      h+='</div>';
    }
  }
  return h;
}
function weekGo(n){UI.week=addDays(UI.week,7*n);render()}
function shopAdd(i){
  const x=SHOP[i];if(!x)return;
  itemForm({name:x.name,qty:Math.ceil(x.miss),t:x.t,ppb:x.ppb});
}
async function copyShop(){
  const buy=SHOP.filter(x=>x.miss>0.0001);
  const text='Lista della spesa\n'+buy.map(x=>'□ '+x.name+' — '+fmtQty(Math.ceil(x.miss),x.t)).join('\n');
  try{
    if(navigator.share){await navigator.share({text});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(text);toast('Lista copiata')}
  catch(e){
    openSheet('<h2>Lista della spesa</h2><textarea style="width:100%;height:220px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:10px" readonly>'+esc(text)+'</textarea><button class="btn sec block" style="margin-top:10px" onclick="closeSheet()">Chiudi</button>');
  }
}

loadLocal();render();connect();
